# LiteLLM router config.
# Friendly names on the left are what users and apps see; backends on the right.
# Swapping a backend = editing this file + `docker compose restart litellm`. Nothing upstream changes.
#
# Two backends are wired:
#   - oMLX  (OpenAI-compatible MLX server on the Mac host; faster than Ollama on Apple Silicon, serves
#            chat + vision + embeddings + STT + TTS). Primary on a Mac.
#   - Ollama (host on Mac, container on Linux). Primary on Linux; fallback on Mac.
# Set CHAT_MODEL / EMBED_MODEL in .env to choose which friendly name the stack uses.

model_list:
  # ---------------- oMLX (Apple Silicon primary) ----------------
  - model_name: local/chat
    litellm_params:
      model: openai/Qwen3.8-27B-4bit
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
  - model_name: local/chat-small
    litellm_params:
      model: openai/gemma4-e4b-mlx
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
  - model_name: local/chat-code
    litellm_params:
      model: openai/qwen3.8-27b-coder
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
  - model_name: local/embed
    litellm_params:
      model: openai/embeddinggemma-300m
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
  - model_name: local/stt
    litellm_params:
      model: openai/whisper-turbo
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY

  # Everything else oMLX serves, under its own name, so a client that already calls the engine
  # directly keeps working when the public gateway is pointed at this router instead.
  - model_name: gpt-oss-20b-mlx
    litellm_params: { model: openai/gpt-oss-20b-mlx, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: Qwen3.8-27B-4bit
    litellm_params: { model: openai/Qwen3.8-27B-4bit, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: gemma4-e4b-mlx
    litellm_params: { model: openai/gemma4-e4b-mlx, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: qwen3.8-27b-coder
    litellm_params: { model: openai/qwen3.8-27b-coder, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: embeddinggemma-300m
    litellm_params: { model: openai/embeddinggemma-300m, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: embedding }

  # Vision. oMLX serves these and they were the one family missing from the list
  # above, so a client that pointed at the engine directly lost them the moment
  # the public gateway was flipped to this router. captcha-api reads images with
  # a panel of them and needs at least two to produce a confidence score at all.
  - model_name: qwen2.5-vl-7b
    litellm_params: { model: openai/qwen2.5-vl-7b, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: qwen3-vl-2b
    litellm_params: { model: openai/qwen3-vl-2b, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: qwen3-vl-4b
    litellm_params: { model: openai/qwen3-vl-4b, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: qwen3-vl-8b
    litellm_params: { model: openai/qwen3-vl-8b, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }

  - model_name: qwen3.5-9b
    litellm_params: { model: openai/qwen3.5-9b, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: qwen3.5-4b
    litellm_params: { model: openai/qwen3.5-4b, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
  - model_name: phi4-mini
    litellm_params: { model: openai/phi4-mini, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }

  # Speech. mode lets `/health` check them correctly instead of sending a chat probe.
  - model_name: local/tts
    litellm_params: { model: openai/kokoro-tts, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: audio_speech }
  - model_name: kokoro-tts
    litellm_params: { model: openai/kokoro-tts, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: audio_speech }
  - model_name: whisper-turbo
    litellm_params: { model: openai/whisper-turbo, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: audio_transcription }
  - model_name: parakeet-v3
    litellm_params: { model: openai/parakeet-v3, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: audio_transcription }
  - model_name: parakeet-tdt-0.6b-v2
    litellm_params: { model: openai/parakeet-tdt-0.6b-v2, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: audio_transcription }
  - model_name: qwen3-asr-0.6b-8bit
    litellm_params: { model: openai/qwen3-asr-0.6b-8bit, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: audio_transcription }
  - model_name: qwen3-asr-1.7b-8bit
    litellm_params: { model: openai/qwen3-asr-1.7b-8bit, api_base: os.environ/OMLX_BASE_URL, api_key: os.environ/OMLX_API_KEY }
    model_info: { mode: audio_transcription }

  # ---------------- Ollama (Linux primary / portability) ----------------
  # Commented out rather than deleted: this router is public on the reference Mac, where Ollama was
  # retired, and a listed model that cannot answer is worse than one that is absent. On a host that
  # runs Ollama (see the `linux` compose profile) uncomment these and set OLLAMA_BASE_URL. The point
  # of the aliases stands either way — swapping backend is a change here, not in any client.
  # - model_name: ollama/chat
  #   litellm_params:
  #     model: ollama_chat/qwen3:8b
  #     api_base: os.environ/OLLAMA_BASE_URL
  # - model_name: ollama/chat-small
  #   litellm_params:
  #     model: ollama_chat/qwen3:4b
  #     api_base: os.environ/OLLAMA_BASE_URL
  # - model_name: ollama/embed
  #   litellm_params:
  #     model: ollama/nomic-embed-text
  #     api_base: os.environ/OLLAMA_BASE_URL

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300

litellm_settings:
  drop_params: true
  set_verbose: false
  success_callback: []
  failure_callback: []
  callbacks: ["prometheus"]  # /metrics for the observability profile

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
