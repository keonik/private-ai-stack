# LiteLLM router config.
# Friendly names on the left are what users and apps see; backends on the right.
# Add a backend = add a block. Restart litellm. Nothing upstream changes.

model_list:
  # ---- default chat + embed via Ollama (host on Mac, container on Linux) ----
  - model_name: local/chat
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: local/chat-small
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: local/embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL

  # ---- optional: MLX server on Apple Silicon (OpenAI-compatible), faster than Ollama on the same Mac ----
  - model_name: mlx/chat
    litellm_params:
      model: openai/default
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY

  # ---- optional: llama.cpp server (OpenAI-compatible) ----
  # - model_name: llamacpp/chat
  #   litellm_params:
  #     model: openai/default
  #     api_base: http://llamacpp:8081/v1
  #     api_key: unused

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120

litellm_settings:
  drop_params: true
  set_verbose: false
  # every request is written to Postgres (spend logs) because DATABASE_URL is set
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # virtual keys: create with  POST /key/generate  (see scripts/new-key.sh)
  # budgets/rate limits are per key; nothing shares the master key in production
