{
 "apiVersion": 1,
 "deleteRules": [
  {
   "orgId": 1,
   "uid": "gp-run-unfinished"
  }
 ],
 "groups": [
  {
   "orgId": 1,
   "name": "private-ai-stack",
   "folder": "Private AI stack",
   "interval": "1m",
   "rules": [
    {
     "uid": "pas-service-down",
     "title": "Service down",
     "condition": "C",
     "for": "2m",
     "labels": {
      "severity": "critical"
     },
     "annotations": {
      "summary": "{{ $labels.service }} is not answering its health endpoint",
      "description": "Probed every 15 s by blackbox. Targets live in observability/prometheus/internal-targets.json; an entry with alert:\"false\" is watched on the dashboard but never alerts."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "min by (service) (probe_success{job=\"probes\", alert!=\"false\"})",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "lt",
           "params": [
            1
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-public-down",
     "title": "Public hostname unreachable",
     "condition": "C",
     "for": "5m",
     "labels": {
      "severity": "critical"
     },
     "annotations": {
      "summary": "{{ $labels.service }} cannot be reached from the internet",
      "description": "The service itself may be fine: this is the tunnel, DNS or the proxy in front of it. A Cloudflare Access login page counts as reachable."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "min by (service) (probe_success{job=\"public\"})",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "lt",
           "params": [
            1
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-llm-errors",
     "title": "Model requests failing",
     "condition": "C",
     "for": "0s",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "{{ $values.A.Value | printf \"%.0f\" }} failed model requests in the last 10 minutes",
      "description": "Look at the Errors panel and the LiteLLM logs; usually the backend is down or a model was renamed."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "sum(increase(litellm_proxy_failed_requests_metric_total[10m])) or vector(0)",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            3
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-chat-slow",
     "title": "Chat p95 latency over 2 minutes",
     "condition": "C",
     "for": "10m",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "local/chat p95 is {{ $values.A.Value | printf \"%.0f\" }} s",
      "description": "Sustained slowness: a batch job is sharing the GPU, or the model is swapping."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "histogram_quantile(0.95, sum by (le) (rate(litellm_request_total_latency_metric_bucket{requested_model=\"local/chat\"}[15m])))",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            120
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-rag-ingest-errors",
     "title": "Document ingest errors",
     "condition": "C",
     "for": "0s",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "{{ $values.A.Value | printf \"%.0f\" }} files failed to index in the last 10 minutes",
      "description": "See data/audit.jsonl ingest_error events for the filename and reason."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "sum(increase(rag_ingested_files_total{result=\"error\"}[10m])) or vector(0)",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-restarts",
     "title": "Container restarting",
     "condition": "C",
     "for": "0s",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "{{ $labels.service }} restarted {{ $values.A.Value | printf \"%.0f\" }} times in the last hour",
      "description": "docker compose logs <service>"
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "max by (service) (clamp_min(increase(container_restarts_total[1h]), 0))",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            2
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-disk",
     "title": "Disk almost full on the Mac",
     "condition": "C",
     "for": "10m",
     "labels": {
      "severity": "critical"
     },
     "annotations": {
      "summary": "The Mac's disk is {{ $values.A.Value | humanizePercentage }} full",
      "description": "Everything on this machine stops when the boot volume fills: models, Docker, backups. `docker system prune` and stack/backups are the usual places to reclaim space."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "max(host_disk_used_ratio)",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0.9
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-swap",
     "title": "The Mac is swapping",
     "condition": "C",
     "for": "15m",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "Swap in use is {{ $values.A.Value | humanize1024 }}B",
      "description": "A machine serving models should not swap. Something is over-committed: check the Memory panel and which models are loaded."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "host_swap_used_bytes",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            8000000000.0
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-host-metrics-down",
     "title": "Host metrics exporter down",
     "condition": "C",
     "for": "10m",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "No disk or memory readings from the Mac",
      "description": "launchctl list | grep host-metrics; the agent is dev.private-ai-stack.host-metrics."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "up{job=\"host\"}",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "lt",
           "params": [
            1
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    },
    {
     "uid": "pas-memory",
     "title": "Container memory above 85% of the Docker VM",
     "condition": "C",
     "for": "5m",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "Containers use {{ $values.A.Value | humanizePercentage }} of the Docker memory limit",
      "description": "On macOS this is the colima / Docker Desktop VM, not the Mac. Raise the VM memory or trim services."
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prom",
       "model": {
        "refId": "A",
        "expr": "sum(container_memory_bytes) / max(container_memory_limit_bytes)",
        "instant": true,
        "intervalMs": 15000,
        "maxDataPoints": 100
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "A",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0.85
           ]
          },
          "operator": {
           "type": "and"
          },
          "query": {
           "params": [
            "A"
           ]
          },
          "reducer": {
           "type": "last"
          },
          "type": "query"
         }
        ]
       }
      }
     ],
     "noDataState": "OK",
     "execErrState": "Error",
     "isPaused": false
    }
   ]
  }
 ]
}