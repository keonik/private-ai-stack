apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
  - name: LiteLLM spend (Postgres)
    uid: spend
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: $POSTGRES_USER
    secureJsonData: { password: $POSTGRES_PASSWORD }
    jsonData: { database: $POSTGRES_DB, sslmode: disable, postgresVersion: 1600, timescaledb: false }
