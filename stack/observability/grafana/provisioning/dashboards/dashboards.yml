apiVersion: 1
# One provider per Grafana folder; each points at its own subdirectory of
# dashboards/. Add a gitignored dashboards-local.yml here for folders that are not
# part of this repo — Grafana provisions every file in this directory.
# observability/grafana/dashboards. Dashboards are generated — edit
# build_dashboards.py and re-run it, don't hand-edit the JSON.
providers:
  - name: private-ai-stack
    folder: Private AI stack
    type: file
    options: { path: /var/lib/grafana/dashboards/stack, foldersFromFilesStructure: false }
