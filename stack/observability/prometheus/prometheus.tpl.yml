# Rendered to /prometheus/prometheus.yml at container start (the LiteLLM and worker keys are
# substituted in; see compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: litellm
    metrics_path: /metrics/
    authorization: { credentials: "__LITELLM_KEY__" }
    static_configs: [{ targets: ["litellm:4000"] }]
  - job_name: rag-ingest
    static_configs: [{ targets: ["rag-ingest:8080"] }]
  - job_name: docker
    static_configs: [{ targets: ["docker-stats:9417"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
  # "Is it up" probes for anything on this machine, container or not. Edit internal-targets.json —
  # one line per URL — and Prometheus picks it up within a minute. A 401 counts as up (it answered).
  - job_name: probes
    metrics_path: /probe
    params: { module: [http_up] }
    file_sd_configs:
      - files: ["/etc/prometheus/internal-targets.json"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      # `name` from the targets file wins, so a tile says "recto" and not "host.docker.internal"
      - source_labels: [__param_target]
        regex: "https?://host\\.docker\\.internal:([0-9]+).*"
        target_label: port
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: "https?://([^:/]+).*"
        target_label: service
      - source_labels: [name]
        regex: "(.+)"
        target_label: service
      - target_label: __address__
        replacement: blackbox:9115

  # The voice demo, run on this Mac by deployer/ (published on 127.0.0.1:8093): per-turn latency, Smart Turn
  # verdicts and interruption outcomes reported by real sessions. See the "voice demo" dashboard.
  - job_name: voice-demo
    static_configs: [{ targets: ["host.docker.internal:8093"] }]

  # The Mac itself: disk, memory, load. Runs on the host because a container cannot see macOS.
  - job_name: host
    static_configs: [{ targets: ["host.docker.internal:9419"] }]

  # Tunnel health: the same services as seen from the internet. Targets live in public-targets.json,
  # which is gitignored so hostnames stay out of the repo; copy public-targets.example.json to start.
  - job_name: public
    metrics_path: /probe
    params: { module: [public_up] }
    file_sd_configs:
      - files: ["/etc/prometheus/public-targets.json"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: "https?://([^:/]+).*"
        target_label: service
      - target_label: __address__
        replacement: blackbox:9115
